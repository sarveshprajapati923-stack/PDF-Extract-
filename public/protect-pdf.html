<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protect PDF - WePDFHub</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
  
</head>

<body>

<div class="tool-container">
  <h2>🔐 Protect PDF</h2>

  <div class="upload-box">

    <div class="upload-area">

      <label id="dropArea">
        Click or Drop PDF Here
        <input type="file" id="fileInput" accept="application/pdf">
      </label>

    </div>

  </div>

  <input type="password" id="password" placeholder="Enter Password">

  <div class="strength"><span id="bar"></span></div>

  <button class="hero-btn primary glow-btn" onclick="protectPDF()">
  Protect PDF
  </button>
  
<div class="loader" id="loader">
  <div></div>
  <div></div>
  <div></div>
</div>

<div class="related-tools">

  <a class="tool-card" href="/merge-pdf">Merge PDF</a>

  <a class="tool-card" href="/split-pdf">Split PDF</a>

</div>
  
<script>
const fileInput = document.getElementById("fileInput");
const dropArea = document.getElementById("dropArea");
const bar = document.getElementById("bar");

// Drag & Drop
dropArea.addEventListener("dragover", e => {
  e.preventDefault();
  dropArea.style.background = "#0ea5e9";
});

dropArea.addEventListener("dragleave", () => {
  dropArea.style.background = "";
});

dropArea.addEventListener("drop", e => {
  e.preventDefault();
  fileInput.files = e.dataTransfer.files;
  dropArea.style.background = "";
});

// Password strength
document.getElementById("password").addEventListener("input", e => {
  const val = e.target.value;
  let strength = 0;
  if(val.length > 5) strength += 30;
  if(/[A-Z]/.test(val)) strength += 20;
  if(/[0-9]/.test(val)) strength += 20;
  if(/[^A-Za-z0-9]/.test(val)) strength += 30;

  bar.style.width = strength + "%";

  if(strength < 40) bar.style.background = "#ef4444";
  else if(strength < 70) bar.style.background = "#f59e0b";
  else bar.style.background = "#22c55e";
});

async function protectPDF(){
  const file = fileInput.files[0];
  const password = document.getElementById("password").value;

  if(!file || !password){
    alert("Upload file & enter password");
    return;
  }

  document.getElementById("loader").style.display = "block";

  const formData = new FormData();
  formData.append("pdf", file);
  formData.append("password", password);

  const res = await fetch("/protect-pdf", {
    method:"POST",
    body:formData
  });

  const blob = await res.blob();
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "protected.pdf";
  a.click();

  document.getElementById("loader").style.display = "none";
}
</script>
</div>

</body>
</html>
