<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protect PDF - WePDFHub</title>
  <meta name="description" content="Protect PDF online with password security. Fast, secure and easy PDF protection tool by WePDFHub.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=2">
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo-box">
          <img src="/favicon.png" class="brand-logo" alt="WePDFHub logo">
          <span class="logo-glow"></span>
        </div>
        <span class="logo-text">We<span>PDF</span>Hub</span>
      </div>

      <div class="top-actions">
        <a class="top-link" href="/merge-pdf">Merge PDF</a>
        <a class="top-link" href="/pdf-to-excel">PDF to Excel</a>
        <a class="top-link primary" href="/split-pdf">Split PDF</a>
      </div>
    </div>
  </header>
  
  <div class="wrap">
  <main class="tool-container">
    <section class="upload-box">
      <h2>🔐 Protect PDF</h2>
      <p style="margin-top:8px;color:#64748b;line-height:1.6;">
        Add a password to lock your PDF securely.
      </p>

      <div class="upload-area" id="dropArea" style="margin-top:22px;">
        Click or Drop PDF Here
        <input type="file" id="fileInput" accept="application/pdf">
      </div>

      <input type="password" id="password" placeholder="Enter Password" style="margin-top:18px;">

      <div class="strength"><span id="bar"></span></div>

      <button class="hero-btn primary glow-btn" onclick="protectPDF()">
        Protect PDF
      </button>

      <div class="loader" id="loader">
        <div></div>
        <div></div>
        <div></div>
      </div>
    </section>

    <section class="related-tools">
      <h3 style="margin-bottom:14px;">Related Tools</h3>

      <a class="tool-card" href="/merge-pdf">Merge PDF</a>
      <a class="tool-card" href="/split-pdf">Split PDF</a>
      <a class="tool-card" href="/compress-pdf">Compress PDF</a>
    </section>
  </main>
  </div>

  <footer class="footer">
    <div class="footer-content">
      <div class="footer-brand">
        <h3>WePDFHub</h3>
        <p>Fast, secure and modern PDF tools for everyone.</p>
      </div>

      <div class="footer-links">
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
        <a href="/privacy-policy">Privacy Policy</a>
        <a href="/terms">Terms</a>
        <a href="/disclaimer">Disclaimer</a>
      </div>

      <div class="socials">
        <a href="#">📘</a>
        <a href="#">📸</a>
        <a href="#">▶️</a>
        <a href="#">💬</a>
      </div>
    </div>
  </footer>

  <script>
    const fileInput = document.getElementById("fileInput");
    const dropArea = document.getElementById("dropArea");
    const bar = document.getElementById("bar");

    dropArea.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropArea.style.background = "#eaf4ff";
      dropArea.style.borderColor = "#2563eb";
    });

    dropArea.addEventListener("dragleave", () => {
      dropArea.style.background = "";
      dropArea.style.borderColor = "";
    });

    dropArea.addEventListener("drop", (e) => {
      e.preventDefault();
      fileInput.files = e.dataTransfer.files;
      dropArea.style.background = "";
      dropArea.style.borderColor = "";
    });

    document.getElementById("password").addEventListener("input", (e) => {
      const val = e.target.value;
      let strength = 0;

      if (val.length > 5) strength += 30;
      if (/[A-Z]/.test(val)) strength += 20;
      if (/[0-9]/.test(val)) strength += 20;
      if (/[^A-Za-z0-9]/.test(val)) strength += 30;

      bar.style.width = strength + "%";

      if (strength < 40) bar.style.background = "#ef4444";
      else if (strength < 70) bar.style.background = "#f59e0b";
      else bar.style.background = "#22c55e";
    });

    async function protectPDF() {
      const file = fileInput.files[0];
      const password = document.getElementById("password").value;

      if (!file || !password) {
        alert("Upload file & enter password");
        return;
      }

      document.getElementById("loader").style.display = "block";

      const formData = new FormData();
      formData.append("pdf", file);
      formData.append("password", password);

      try {
        const res = await fetch("/protect-pdf", {
          method: "POST",
          body: formData
        });

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "protected.pdf";
        a.click();
      } finally {
        document.getElementById("loader").style.display = "none";
      }
    }
  </script>
</body>
</html>
