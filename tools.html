<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WePDFHub Tool</title>

<link rel="stylesheet" href="/style.css">

<style>

body{
  margin:0;
  background:#eef4ff;
  font-family:Arial,sans-serif;
  color:#111827;
}

/* TOOL AREA */

.tool-wrap{
  padding:25px 18px 60px;
  text-align:center;
}

.tool-box{
  max-width:700px;
  margin:auto;
}

.tool-title{
  font-size:38px;
  font-weight:700;
  margin-top:20px;
  color:#0f172a;
}

.tool-desc{
  margin-top:15px;
  color:#475569;
  font-size:18px;
  line-height:1.6;
}

/* BUTTON */

.upload-btn{
  width:100%;
  border:none;
  margin-top:35px;
  background:linear-gradient(135deg,#2563eb,#3b82f6);
  color:#fff;
  padding:28px 20px;
  border-radius:22px;
  font-size:30px;
  font-weight:700;
  cursor:pointer;
  transition:.3s;
  box-shadow:0 10px 30px rgba(37,99,235,.25);
}

.upload-btn:hover{
  transform:translateY(-4px) scale(1.01);
}

/* SMALL ICON BUTTONS */

.quick-actions{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:28px;
  flex-wrap:wrap;
}

.quick-btn{
  width:58px;
  height:58px;
  border-radius:50%;
  border:none;
  background:#2563eb;
  color:#fff;
  font-size:24px;
  cursor:pointer;
  transition:.3s;
  box-shadow:0 5px 15px rgba(37,99,235,.3);
}

.quick-btn:hover{
  transform:scale(1.08);
}

/* INFO BOX */

.info-box{
  margin-top:55px;
  background:#f8fbff;
  border:2px solid #cfe0ff;
  border-radius:24px;
  padding:30px;
  text-align:left;
}

.info-box h2{
  margin-top:0;
  color:#0f172a;
}

.info-box p{
  color:#475569;
  line-height:1.8;
  font-size:17px;
}

/* MOBILE */

@media(max-width:768px){

  .tool-title{
    font-size:28px;
  }

  .upload-btn{
    font-size:22px;
    padding:22px 15px;
  }

}

</style>
</head>

<body>

<!-- HEADER -->

<div id="header"></div>

<!-- TOOL SECTION -->

<section class="tool-wrap">

  <div class="tool-box">

    <h1 class="tool-title" id="toolTitle">
      Protect PDF File
    </h1>

    <p class="tool-desc" id="toolDesc">
      Secure your PDF files online quickly and safely with advanced encryption.
    </p>

    <input type="file" id="fileInput" hidden>
    
<label for="fileInput" class="upload-btn">
  Select PDF File
</label>

    <div class="quick-actions">

      <button class="quick-btn">📁</button>
      <button class="quick-btn">☁️</button>
      <button class="quick-btn">🔗</button>
      <button class="quick-btn">🗑️</button>

    </div>

    <div class="info-box">

      <h2>Fast. Secure. Private.</h2>

      <p>
        WePDFHub processes your files securely with privacy-focused technology.
        Your uploaded files are automatically deleted after processing.
      </p>

    </div>

  </div>

</section>

<!-- FOOTER -->

<div id="footer"></div>

<script>

/* LOAD HEADER */

fetch("/header.html")
.then(res => res.text())
.then(data => {
  document.getElementById("header").innerHTML = data;
});

/* LOAD FOOTER */

fetch("/footer.html")
.then(res => res.text())
.then(data => {
  document.getElementById("footer").innerHTML = data;
});

/* DYNAMIC TOOL SYSTEM */

const params = new URLSearchParams(window.location.search);

const type = params.get("type");

const title = document.getElementById("toolTitle");

const desc = document.getElementById("toolDesc");

if(type === "merge"){

  title.innerText = "Merge PDF Files";

  desc.innerText =
  "Combine multiple PDF files into one secure document instantly.";

}

else if(type === "split"){

  title.innerText = "Split PDF File";

  desc.innerText =
  "Separate PDF pages easily into multiple independent files.";

}

else if(type === "compress"){

  title.innerText = "Compress PDF File";

  desc.innerText =
  "Reduce PDF size while maintaining high quality.";

}

else if(type === "protect"){

  title.innerText = "Protect PDF File";

  desc.innerText =
  "Add password security to your PDF documents online.";

}
  document.getElementById("fileInput").addEventListener("change", (e) => {
  console.log(e.target.files[0]);
});

</script>

</body>
  </html>
